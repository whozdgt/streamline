name: spec-links
# Lists the specification links on each exam board's course page (.github/specs/pages.txt): where a course's current
# document is, for Streamline's list of specifications (specs/catalog.json), and where one went when a board moves it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/specs/pages.txt', '.github/workflows/spec-links.yml']

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for the specification on each page
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          grep -v '^#' .github/specs/pages.txt | grep -v '^\s*$' | while IFS='|' read -r board level page; do
            page="$(echo "$page" | xargs)"
            code=$(curl -sL -A "$UA" -o page.html -w '%{http_code} %{url_effective}' --retry 2 --max-time 40 "$page" || true)
            links=$(grep -oiE '(href|data-href|data-url)="[^"]+\.pdf[^"]*"' page.html | sed -E 's/^[a-z-]+="//; s/"$//' | grep -iE 'spec|syllabus' | sort -u | head -8)
            echo "PAGE $page -> $code"
            if [ -z "$links" ]; then echo "  (no specification links)"; grep -oiE 'href="[^"]+\.pdf[^"]*"' page.html | head -4 | sed 's/^/  any: /'; fi
            echo "$links" | sed '/^$/d; s/^/  /'
          done
