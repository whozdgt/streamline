name: match
# How often Pods put a document under the right point of a specification: students' notes written for the test
# (tests/match/*.txt, each under the point it is about) matched to the boards' real specifications, downloaded from
# the boards' websites, by each way of matching (tests/match_eval.cpp). Prints percentages and the misses' numbers.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/podai*', 'src/podsort*', 'src/specread*', 'tests/match_eval.cpp', 'tests/match/**', '.github/workflows/match.yml']

jobs:
  eval:
    runs-on: ubuntu-latest
    # The meaning model the app uses, and bigger ones it could use instead: each is tried on the same notes.
    # They all read with BGE's query instruction ("Represent this sentence for searching relevant passages: ").
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: bge-small (the app, 34 MB)
            urls: https://github.com/whozdgt/streamline/releases/download/ai-models/meaning-bge-small-en-v1.5-q8_0.gguf
          - model: bge-base (110 MB)
            urls: >-
              https://huggingface.co/CompendiumLabs/bge-base-en-v1.5-gguf/resolve/main/bge-base-en-v1.5-q8_0.gguf
              https://huggingface.co/ggml-org/bge-base-en-v1.5-Q8_0-GGUF/resolve/main/bge-base-en-v1.5-q8_0.gguf
          - model: arctic-embed-m-v1.5 (110 MB)
            urls: >-
              https://huggingface.co/ChristianAzinn/snowflake-arctic-embed-m-v1.5-gguf/resolve/main/snowflake-arctic-embed-m-v1.5--Q8_0.GGUF
              https://huggingface.co/Casual-Autopsy/snowflake-arctic-embed-m-v1.5-Q8_0-GGUF/resolve/main/snowflake-arctic-embed-m-v1.5-q8_0.gguf
              https://huggingface.co/mradermacher/snowflake-arctic-embed-m-v1.5-GGUF/resolve/main/snowflake-arctic-embed-m-v1.5.Q8_0.gguf
    name: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      # llama.cpp takes a few minutes to build: keep the build between runs
      - uses: actions/cache@v4
        with:
          path: build-tests
          key: match-build-${{ hashFiles('cmake/llama.cmake') }}-${{ github.sha }}
          restore-keys: match-build-${{ hashFiles('cmake/llama.cmake') }}-
      - uses: actions/cache@v4
        with:
          path: specs
          key: match-specs-${{ hashFiles('tests/match/*.txt') }}
          restore-keys: match-specs-
      - name: Build
        run: |
          cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build-tests -j4 --target match_eval 2>&1 | grep -E "error|Built target match_eval" || true
      - name: The meaning model
        run: |
          mkdir -p models
          for u in ${{ matrix.urls }}; do
            echo "trying $u"
            curl -fsSL --retry 3 -o models/meaning.gguf "$u" && head -c 4 models/meaning.gguf | grep -q GGUF && break
            rm -f models/meaning.gguf
          done
          test -f models/meaning.gguf || { echo "::error::couldn't download the model"; exit 1; }
          ls -l models/meaning.gguf
      - name: Match the notes to their specs
        run: |
          UA="Streamline/0.7 (+https://github.com/whozdgt/streamline)"
          mkdir -p specs
          for notes in tests/match/*.txt; do
            name=$(basename "$notes" .txt)
            url=$(grep -m1 '^# spec: ' "$notes" | cut -c9-)
            echo "::group::$name"
            head -c 5 "specs/$name.pdf" 2>/dev/null | grep -q '%PDF' || curl -fsSL -A "$UA" --retry 2 -o "specs/$name.pdf" "$url"
            ./build-tests/match_eval models/meaning.gguf "specs/$name.pdf" "$notes" --misses
            echo "::endgroup::"
          done
