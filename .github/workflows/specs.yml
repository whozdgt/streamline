name: specs
# Streamline's spec reader on the exam boards' real, public specifications (.github/specs/research.txt): each is
# downloaded from the board's website, read with Streamline's own PDF reader (compared with poppler's pdftotext),
# and its points are listed. Only the structure is printed (numbers and headings), never the documents themselves.
# Runs when the reader changes, every Monday (to notice when a board moves a document), and by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths: ['src/pdftext*', 'src/pdfcrypto*', 'src/pdfglyphs.inc', 'src/specread*', 'src/podsort*',
            'tests/spec_test.cpp', 'tests/pdftext_test.cpp', '.github/specs/**', '.github/workflows/specs.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          g++ -std=c++17 -O2 -Wall -Isrc src/pdftext.cpp src/pdfcrypto.cpp src/specread.cpp src/podsort.cpp tests/spec_test.cpp -o spec_test
          g++ -std=c++17 -O2 -Wall -Isrc src/pdftext.cpp src/pdfcrypto.cpp tests/pdftext_test.cpp -o pdftext_test
      - name: Read the specifications
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          mkdir -p specs
          cat > f1.py <<'PY'
          import re, sys, collections
          w = lambda t: re.findall(r"\w+", t.lower())
          a = collections.Counter(w(open(sys.argv[1], encoding="utf-8", errors="replace").read()))
          b = collections.Counter(w(open(sys.argv[2], encoding="utf-8", errors="replace").read()))
          common = sum((a & b).values()); p = common / max(1, sum(a.values())); r = common / max(1, sum(b.values()))
          print(f"{(2*p*r/(p+r) if p+r else 0):.3f}")
          PY
          grep -v '^#' .github/specs/research.txt | grep -v '^\s*$' | while IFS='|' read -r name urls; do
            name="$(echo "$name" | xargs)"
            echo "::group::$name"
            got=""
            for u in $(echo "$urls" | tr '|' ' '); do
              code=$(curl -sL -A "$UA" -o "specs/$name.pdf" -w '%{http_code}' --retry 2 "$u" || true)
              if [ "$code" = 200 ] && head -c 4 "specs/$name.pdf" | grep -q '%PDF'; then got="$u"; break; fi
              echo "  $code  $u"
            done
            if [ -z "$got" ]; then echo "RESULT $name: NOT DOWNLOADED"; echo "::endgroup::"; continue; fi
            start=$(date +%s%N)
            ./pdftext_test "specs/$name.pdf" --all-lines > "specs/$name.mine.txt" 2> "specs/$name.err" || true
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            pdftotext -raw "specs/$name.pdf" "specs/$name.ref.txt"
            echo "RESULT $name: read in ${ms} ms, $(cat "specs/$name.err"), words match pdftotext: $(python3 f1.py "specs/$name.mine.txt" "specs/$name.ref.txt")"
            # fonts whose characters couldn't be read (only when many words differ from pdftotext)
            if [ "$(python3 f1.py "specs/$name.mine.txt" "specs/$name.ref.txt" | cut -c1-3)" != "1.0" ] && \
               [ "$(python3 -c "print(float('$(python3 f1.py "specs/$name.mine.txt" "specs/$name.ref.txt")') < 0.97)")" = True ]; then
              PDFTEXT_DEBUG=1 ./pdftext_test "specs/$name.pdf" > /dev/null 2> debug.txt; grep '^font' debug.txt | sort -t= -k7 -n -r | head -15
              pdffonts "specs/$name.pdf" | head -30
            fi
            ./spec_test "specs/$name.pdf" --head
            ./spec_test "specs/$name.pdf" | head -260
            # where a heading's layout needs a closer look (a few lines either side, cut short)
            for probe in "1.13" "2.10" "4.2.3.1" "3.2.3.1" "(h) Transport" "Key topic 2: Involvements"; do
              out="$(./spec_test "specs/$name.pdf" --around "$probe")"
              [ -n "$out" ] && echo "around \"$probe\":" && echo "$out"
            done
            echo "::endgroup::"
          done
