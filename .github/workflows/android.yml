name: android

# Builds Streamline for Android (app ID io.github.whozdgt.streamline, so it installs beside Paraplay).
#  - every push to main and every pull request: builds it, so a mistake shows up here, and keeps the APK for 14 days
#    (open the run, scroll to "Artifacts")
#  - a version tag like v0.3.0: also attaches the APK to that release
#  - every push to main: publishes the APK as the "android-latest" release. That is what the app's "Update now"
#    button downloads, and you can also install it from that release page.
#
# Signing: Android only lets an update replace an install that was signed with the same key (or with a key the old one
# handed over to). The keys live in two repository secrets (Settings > Secrets and variables > Actions), never in
# this repository:
#   ANDROID_KEYSTORE_BASE64    a PKCS12 keystore, base64 encoded, holding two keys:
#                                "streamline"    the original key. Builds 1 and 2 were signed with it, and it was public
#                                                in this repository for a day, so it only hands over to the new key now.
#                                "streamline-2"  the private key every build is signed with.
#   ANDROID_KEYSTORE_PASSWORD  its password (also the password of both keys)
# Each build is signed with "streamline-2" plus a proof, signed by "streamline", that the old key handed over to it
# (APK Signature Scheme v3 key rotation, for Android 9 and newer). So a phone with build 1 or 2 installs the update
# normally, and once it has, Android refuses anything signed with the old key alone.
# Without the secrets, each build is signed with throwaway keys: it installs, but can't update an earlier install, so
# it is never published.
#
# The Google Play bundle (an .aab without the self-updater) is switched off: add "play" to the variant list below to
# build it as well. See STORES.md.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', 'src/**', 'qml/**', 'CMakeLists.txt', 'packaging/android/**', '.github/workflows/android.yml', '.github/scripts/**']
  pull_request:
    paths: ['android/**', 'src/**', 'qml/**', 'CMakeLists.txt', 'packaging/android/**', '.github/workflows/android.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: write      # to attach the APK to a release

env:
  QT_SERIES: "6.10"          # the newest 6.10.x is used: Qt 6.10 supports Android 16 (API 36), which Play requires
  NDK_VERSION: 27.2.12479018  # the NDK Qt 6.10 itself is built with (r27c)
  SDK_PLATFORM: 36
  BUILD_TOOLS: 36.0.0
  TAGLIB_VERSION: v2.0.2
  BUNDLETOOL_VERSION: 1.18.1

jobs:
  apk:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [sideload]      # add play for the Google Play bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Qt is installed twice: the build tools run on this machine (gcc_64), the libraries are for the phone.
      - name: Pick the Qt version
        run: |
          pip install --quiet aqtinstall
          v="$(aqt list-qt all_os android --spec "$QT_SERIES" --latest-version)"
          [ -n "$v" ] || { aqt list-qt all_os android; exit 1; }
          echo "Using Qt $v"
          echo "QT_VERSION=$v" >> "$GITHUB_ENV"

      - name: Cached Qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt/Qt
          key: qt-android-${{ env.QT_VERSION }}-v1

      - name: Qt for this machine and for Android
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: |
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtmultimedia -O "$GITHUB_WORKSPACE/qt/Qt"
          aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -m qtmultimedia -O "$GITHUB_WORKSPACE/qt/Qt"
          ls "$GITHUB_WORKSPACE/qt/Qt/$QT_VERSION"

      - name: Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${SDK_PLATFORM}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: TagLib for Android (reads song tags)
        run: |
          git clone --depth 1 --branch "$TAGLIB_VERSION" --recurse-submodules https://github.com/taglib/taglib.git
          cmake -S taglib -B taglib-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BINDINGS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/taglib-android"
          cmake --build taglib-build
          cmake --install taglib-build
          ls -l taglib-android/lib

      - name: OpenSSL and font for the app
        run: |
          # Qt on Android loads OpenSSL from inside the app, otherwise https (sign-in, servers) fails
          git clone --depth 1 https://github.com/KDAB/android_openssl.git openssl
          ls openssl/ssl_3/arm64-v8a
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-jetbrains-mono
          font="$(dpkg -L fonts-jetbrains-mono | grep -m1 'JetBrainsMono-Regular.ttf$')"
          echo "FONT_DIR=$(dirname "$font")" >> "$GITHUB_ENV"
          ls "$(dirname "$font")" | head

      - name: Configure
        run: |
          QT_ANDROID="$GITHUB_WORKSPACE/qt/Qt/${QT_VERSION}/android_arm64_v8a"
          QT_HOST="$GITHUB_WORKSPACE/qt/Qt/${QT_VERSION}/gcc_64"
          "$QT_ANDROID/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DTAGLIB_PREFIX="$GITHUB_WORKSPACE/taglib-android" \
            -DANDROID_OPENSSL_DIR="$GITHUB_WORKSPACE/openssl" \
            -DANDROID_FONT_DIR="$FONT_DIR" \
            -DPARAPLAY_STORE=${{ matrix.variant == 'play' && 'ON' || 'OFF' }} \
            -DANDROID_VERSION_CODE="${{ github.run_number }}" 2>&1 | tee configure.log
          exit "${PIPESTATUS[0]}"

      - name: Build
        run: |
          set +e
          target=apk; [ "${{ matrix.variant }}" = play ] && target=aab
          cmake --build build-android --target "$target" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # put the useful lines where the Actions API shows them (the full log needs a sign-in)
            esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", substr($0,1,300)}'; }
            msg="$(grep -n -i -E 'error|undefined|FAILED|not found|could not|exception|what went wrong' build.log | head -25 | esc)"
            echo "::error title=build errors::${msg}"
            msg="$(tail -n 25 build.log | esc)"
            echo "::error title=end of build log::${msg}"
          fi
          exit "$rc"

      - name: Sign
        id: sign
        if: matrix.variant == 'sideload'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ver="$(sed -n 's/^project(musicplayer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          bt="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          src="$(find build-android -name '*.apk' | sort | head -1)"
          out="Streamline-${ver}-arm64.apk"
          echo "Built: $src"
          old=streamline; new=streamline-2
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            pass="$KS_PASS"; real=true
            # The old key must be Streamline's original one, or phones with build 1 or 2 couldn't take the update.
            want=cf41a5931abeae0a1aaa904c25b763107447047319b951dba3259650d883ea97
            got="$(keytool -exportcert -alias "$old" -keystore release.jks -storepass "$pass" 2>/dev/null | sha256sum | cut -d' ' -f1)"
            if [ "$got" != "$want" ]; then echo "::error title=signing::The keystore secret has no \"$old\" key, or not the original one"; exit 1; fi
            echo "Signing with the keys from the repository secrets."
          else
            pass=streamline-throwaway; real=false
            for a in "$old" "$new"; do
              keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias "$a" -storepass "$pass" -keypass "$pass" \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Streamline throwaway $a" 2> /dev/null
            done
            echo "::warning title=signing::No signing secrets set: signed with throwaway keys and not published (see the top of this file)."
          fi
          newsha="$(keytool -exportcert -alias "$new" -keystore release.jks -storepass "$pass" 2>/dev/null | sha256sum | cut -d' ' -f1)"
          "$bt/zipalign" -f -P 16 4 "$src" aligned.apk       # 16 KB pages, for Android 15+ phones that use them
          # the old key's signed hand-over to the new one (it may not take updates back: no rollback)
          "$bt/apksigner" rotate --out lineage.bin \
            --old-signer --ks release.jks --ks-key-alias "$old" --ks-pass "pass:$pass" --key-pass "pass:$pass" \
            --new-signer --ks release.jks --ks-key-alias "$new" --ks-pass "pass:$pass" --key-pass "pass:$pass" 2>&1 | tee sign.log
          # the new key signs for Android 9 and newer (the app's minimum), with the hand-over attached
          "$bt/apksigner" sign \
            --ks release.jks --ks-key-alias "$old" --ks-pass "pass:$pass" --key-pass "pass:$pass" \
            --next-signer --ks release.jks --ks-key-alias "$new" --ks-pass "pass:$pass" --key-pass "pass:$pass" \
            --lineage lineage.bin --rotation-min-sdk-version 28 \
            --out "$out" aligned.apk 2>&1 | tee -a sign.log
          rm -f release.jks
          "$bt/apksigner" verify --verbose --print-certs "$out" > verify.txt 2>&1 || { cat verify.txt; echo "::error title=signing::apksigner verify failed"; exit 1; }
          "$bt/apksigner" lineage --in "$out" --print-certs > lineage.txt 2>&1 || true
          cat verify.txt lineage.txt | tee -a sign.log
          # the same text where the Actions API shows it without signing in
          esc() { sed -e 's/%/%25/g' "$1" | awk '{printf "%s%%0A", substr($0,1,200)}'; }
          echo "::notice title=apksigner verify::$(esc verify.txt)"
          echo "::notice title=apksigner lineage::$(esc lineage.txt)"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt || { echo "::error title=signing::No v3 signature"; exit 1; }
          grep -qi "$newsha" verify.txt || { echo "::error title=signing::The APK isn't signed with the new key ($newsha)"; exit 1; }
          echo "real=$real" >> "$GITHUB_OUTPUT"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          ls -l Streamline-*.apk

      - name: Check the APK
        if: matrix.variant == 'sideload'
        run: |
          apk="${{ steps.sign.outputs.apk }}"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion)" || true
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" -c -P 16 4 "$apk" && echo "zip alignment: OK"
          rm -rf so && mkdir so && unzip -q -o "$apk" 'lib/*' -d so
          bash .github/scripts/check-16k.sh so || echo "::warning title=16 KB pages::Some native libraries aren't 16 KB aligned (see log)"

      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'sideload'
        with:
          name: Streamline-android
          path: ${{ steps.sign.outputs.apk }}
          retention-days: 14

      # ---- Google Play: sign the bundle with the upload key, then check it the way Play will ----
      - name: Sign the bundle (Play)
        id: signaab
        if: matrix.variant == 'play'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ver="$(sed -n 's/^project(musicplayer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          src="$(find build-android -name '*.aab' | sort | head -1)"
          [ -n "$src" ] || { echo "::error::No .aab was built"; find build-android -maxdepth 4 -type d -name outputs; exit 1; }
          echo "Built: $src"
          out="Streamline-${ver}-build${{ github.run_number }}-play.aab"
          cp "$src" "$out"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            alias=streamline-2; pass="$KS_PASS"
            echo "Signing with the private key from the repository secrets (use it as the upload key in Play Console)."
          else
            pass="streamline-throwaway"; alias="streamline"
            keytool -genkeypair -keystore release.jks -alias "$alias" -storepass "$pass" -keypass "$pass" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Streamline build"
            echo "::warning::No signing secrets set: the bundle is signed with a throwaway key, so Play won't accept it."
          fi
          jarsigner -keystore release.jks -storepass "$pass" -keypass "$pass" -sigalg SHA256withRSA -digestalg SHA-256 "$out" "$alias"
          jarsigner -verify "$out" | tail -1
          rm -f release.jks
          echo "aab=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - name: Check the bundle (Play)
        if: matrix.variant == 'play'
        run: |
          aab="${{ steps.signaab.outputs.aab }}"
          curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar validate --bundle="$aab" > validate.txt && echo "bundletool validate: OK"
          java -jar bundletool.jar dump manifest --bundle="$aab" > manifest.xml
          grep -o 'android:targetSdkVersion="[0-9]*"' manifest.xml
          grep -q 'android:targetSdkVersion="36"' manifest.xml || { echo "::error::The bundle doesn't target API 36"; exit 1; }
          if grep -q REQUEST_INSTALL_PACKAGES manifest.xml; then echo "::error::The Play bundle still asks to install apps"; exit 1; fi
          echo "No REQUEST_INSTALL_PACKAGES: OK"
          grep -o 'uses-permission[^>]*android:name="[^"]*"' manifest.xml | sed 's/.*name=/  permission: /'
          for p in CAMERA RECORD_AUDIO BLUETOOTH WRITE_EXTERNAL_STORAGE; do
            if grep -q "android.permission.$p\"" manifest.xml; then echo "::error::The Play bundle asks for $p, which the app doesn't use"; exit 1; fi
          done
          rm -rf so && mkdir so && unzip -q -o "$aab" 'base/lib/*' -d so
          bash .github/scripts/check-16k.sh so

      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'play'
        with:
          name: Streamline-play-aab
          path: ${{ steps.signaab.outputs.aab }}
          retention-days: 30

      - name: Attach to the release
        if: matrix.variant == 'sideload' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release workflow creates the release a moment after the tag; wait for it
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" "${{ steps.sign.outputs.apk }}" --clobber

      # The rolling "android-latest" release: the app reads latest.json to see whether a newer build exists,
      # then downloads Streamline-android.apk. It is a pre-release, so it never counts as the desktop's "latest release".
      - name: Publish as the newest build (for in-app updates)
        if: >-
          matrix.variant == 'sideload' &&
          steps.sign.outputs.real == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          VER: ${{ steps.sign.outputs.ver }}
        run: |
          cp "${{ steps.sign.outputs.apk }}" Streamline-android.apk
          sha="$(sha256sum Streamline-android.apk | cut -d' ' -f1)"
          # a slower, older run must not replace a newer build
          cur="$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/latest.json" 2>/dev/null | jq -r '.build // 0' 2>/dev/null || true)"
          [[ "$cur" =~ ^[0-9]+$ ]] || cur=0
          if [ "$cur" -ge "$RUN" ]; then echo "Build $cur is already published; skipping build $RUN."; exit 0; fi
          notes="$(git log -1 --pretty=%B | head -c 600)"
          jq -n --argjson build "$RUN" --arg version "$VER" --arg sha "$sha" --arg notes "$notes" \
            '{build:$build, version:$version, sha256:$sha, notes:$notes}' > latest.json
          cat latest.json
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest Streamline-android.apk latest.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "Streamline for Android: newest build" \
            --notes "Build ${RUN} (version ${VER}). Install Streamline-android.apk on your phone, or tap Update now in the app (Settings, About). The app finds new builds by itself."

      - name: Keep the logs when a build fails
        if: failure()
        run: |
          mkdir -p /tmp/ci-log
          for f in configure.log build.log sign.log; do [ -f "$f" ] && tail -n 3000 "$f" > "/tmp/ci-log/android-$f"; done
          echo "run ${{ github.run_number }}, commit ${{ github.sha }}" > /tmp/ci-log/README
          cd /tmp/ci-log && git init -q -b ci-log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android build ${{ github.run_number }} logs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log
