name: build

# Compiles the player on every push and pull request, so a mistake shows up here before it reaches anyone.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # to publish the interface screenshots as a pre-release

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest      # the same kind of system the player is made for (CachyOS / Arch)
    steps:
      - name: Install build tools
        run: |
          pm="pacman"
          # containers sometimes lack the kernel feature pacman's sandbox needs
          pacman --help 2>&1 | grep -q -- --disable-sandbox && pm="pacman --disable-sandbox"
          $pm -Syu --noconfirm --needed base-devel cmake ninja git pkgconf \
            qt6-base qt6-declarative qt6-svg qt6-shadertools qt6-wayland mpv taglib

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Pods sorting test
        run: g++ -std=c++17 -O2 -Wall -Isrc src/podsort.cpp src/specread.cpp tests/podsort_test.cpp -o podsort_test && ./podsort_test

      # The on-device AI on the same made-up documents, with the real models from the ai-models release.
      - name: On-device AI test
        run: |
          cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build-tests > /dev/null
          mkdir -p models
          for f in meaning-bge-small-en-v1.5-q8_0.gguf writer-qwen2.5-0.5b-instruct-q4_k_m.gguf; do
            curl -fsSL --retry 3 -o "models/$f" "https://github.com/$GITHUB_REPOSITORY/releases/download/ai-models/$f"
          done
          ./build-tests/nest_test tests/spec_sample.txt
          ./build-tests/podai_test models/meaning-bge-small-en-v1.5-q8_0.gguf models/writer-qwen2.5-0.5b-instruct-q4_k_m.gguf tests/spec_sample.txt

      - name: Starts and exits (no display needed)
        run: QT_QPA_PLATFORM=offscreen ./build/musicplayer --version

      - name: Interface loads
        continue-on-error: true      # a hint only: it can't test everything without a screen or a sound card
        run: |
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 8 ./build/musicplayer --music /tmp 2>&1 | tee ui.log || true
          pattern="(qrc:|qml).*(error|Error|is not a type|Cannot assign|ReferenceError|TypeError|Unable to assign|binding loop)"
          if grep -E "$pattern" ui.log; then
            # the first few lines also go into the run's annotations, so they can be read without opening the log
            grep -E "$pattern" ui.log | head -12 | while IFS= read -r line; do echo "::warning::${line}"; done
            echo "::warning::The interface printed errors while loading (see log)"
            exit 1
          fi

      # Pictures of the interface, made in a virtual screen with a small made-up library. A hint for reviewing changes,
      # never a reason to fail the build. Open the run and download "screenshots" under Artifacts.
      - name: Screenshots
        continue-on-error: true
        run: |
          pm="pacman"
          pacman --help 2>&1 | grep -q -- --disable-sandbox && pm="pacman --disable-sandbox"
          $pm -S --noconfirm --needed xorg-server-xvfb mesa ffmpeg ttf-jetbrains-mono zip > /dev/null
          bash .github/scripts/demo-docs.sh /tmp/docs
          bash .github/scripts/demo-music.sh /tmp/music > /dev/null
          mkdir -p shots
          shot() {      # shot <name> <WxH> [options…]
            local name="$1" size="$2"; shift 2
            QT_QPA_PLATFORM=xcb timeout "${SHOT_TIMEOUT:-40}" xvfb-run -a -s "-screen 0 1600x1000x24" \
              ./build/musicplayer --music /tmp/music --size "$size" --screenshot "shots/$name.png" "$@" > "shots/$name.log" 2>&1 || true
            ls -l "shots/$name.png" 2>/dev/null || { echo "::warning::no screenshot for $name"; tail -5 "shots/$name.log"; }
          }
          shot phone-home 390x844 --mobile
          shot phone-albums 390x844 --mobile --set startView=albums
          shot phone-songs 390x844 --mobile --set startView=songs
          shot phone-settings-look 390x844 --mobile --set startSettings=look
          shot phone-player 390x844 --mobile --set startPlay=true --set startExpanded=true
          shot phone-library 390x844 --mobile --set startView=library
          shot phone-album 390x844 --mobile --set "startAlbum=Night Drive"
          shot phone-playing 390x844 --mobile --set startPlay=true --set startView=library
          shot desktop-pods 1280x800 --set startPod=/tmp/docs
          shot phone-pods 390x844 --mobile --set startPod=/tmp/docs
          shot phone-pods-classic 390x844 --mobile --set theme=classic --set startPod=/tmp/docs
          shot phone-pods-list 390x844 --mobile --set startView=pods
          # the welcome screen, then a pod sorted by the on-device AI (the models from the AI test above)
          shot phone-start 390x844 --mobile --set startScreen=true
          shot phone-start-classic 390x844 --mobile --set theme=classic --set startScreen=true
          shot desktop-start 1280x800 --set startScreen=true
          appdata="$(dirname "$(find "$HOME" -name pods.json | head -1)")"
          if [ -d "$appdata" ] && [ -d models ]; then
            mkdir -p "$appdata/models" && cp models/*.gguf "$appdata/models/"
            cp -r /tmp/docs /tmp/study-ai
            SHOT_TIMEOUT=150 shot phone-pods-ai 390x844 --mobile --set startPod=/tmp/study-ai --set shotDelay=100000
            SHOT_TIMEOUT=150 shot desktop-pods-ai 1280x800 --set startPod=/tmp/study-ai --set shotDelay=4000
            shot phone-pods-ai-list 390x844 --mobile --set startView=pods
            cp -r /tmp/docs /tmp/gcse && cp tests/spec_sample.txt "/tmp/Combined Studies spec.txt"
            SHOT_TIMEOUT=200 shot phone-pods-spec 390x844 --mobile --set startPod=/tmp/gcse --set "startSpec=/tmp/Combined Studies spec.txt" --set shotDelay=150000
            SHOT_TIMEOUT=60 shot desktop-pods-spec 1280x800 --set startPod=/tmp/gcse --set shotDelay=4000
            # the spec finder, and a spec downloaded from its board's website (AQA's is an encrypted PDF)
            shot phone-spec-finder 390x844 --mobile --set startPod=/tmp/docs --set startFinder=biology --set shotDelay=6000
            shot desktop-spec-finder 1280x800 --set startPod=/tmp/docs --set "startFinder=aqa" --set shotDelay=6000
            cp -r /tmp/docs /tmp/gcse-aqa
            SHOT_TIMEOUT=230 shot phone-spec-download 390x844 --mobile --set startPod=/tmp/gcse-aqa --set startCatalog=aqa-8461 --set shotDelay=180000
            grep -i -E "spec|catalog|network|ssl" shots/phone-spec-download.log | head -10 || true
          fi
          shot phone-tucked 390x844 --mobile --set startPlay=true --set startTucked=true --set startView=todos
          shot phone-tucked-classic 390x844 --mobile --set theme=classic --set startPlay=true --set startTucked=true --set startView=todos
          STREAMLINE_FAKE_INSETS=60,34 shot phone-settings-insets 390x844 --mobile --set theme=classic --set startPlay=true --set startSettings=look
          STREAMLINE_FAKE_INSETS=60,34 shot phone-glow-insets 390x844 --mobile --set startPlay=true --set startView=library
          shot phone-classic 390x844 --mobile --set theme=classic
          shot phone-flashcards 390x844 --mobile --set startView=flashcards
          shot phone-todos 390x844 --mobile --set startView=todos
          shot phone-add-server 390x844 --mobile --set startView=library --set startPanel=addServer
          shot phone-add-server-narrow 360x780 --mobile --set startView=library --set startPanel=addServer
          shot phone-sign-in 390x844 --mobile --set startPanel=auth
          shot phone-settings-about 390x844 --mobile --set startSettings=about
          mkdir -p /tmp/empty
          shot phone-empty-songs 390x844 --mobile --set startView=songs --music /tmp/empty
          shot desktop-home 1280x800
          shot desktop-songs 1280x800 --set startView=songs
          shot desktop-settings 1280x800 --set startSettings=look
          shot desktop-flashcards 1280x800 --set startView=flashcards
          shot desktop-flashcards-classic 1280x800 --set theme=classic --set startView=flashcards
          shot desktop-todos 1280x800 --set startView=todos
          shot desktop-todos-classic 1280x800 --set theme=classic --set startView=todos
          shot desktop-classic 1280x800 --set theme=classic --set startView=songs
          grep -h -E "(qrc:|qml).*(rror|is not a type|ReferenceError|TypeError|Cannot assign|Unable to assign)" shots/*.log | sort -u | head -20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          retention-days: 7
          if-no-files-found: ignore

      # The same pictures as a rolling pre-release, "ui-screenshots", so they can be fetched without signing in.
      - name: Publish the screenshots
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pm="pacman"
          pacman --help 2>&1 | grep -q -- --disable-sandbox && pm="pacman --disable-sandbox"
          $pm -S --noconfirm --needed github-cli zip > /dev/null
          ls shots/*.png > /dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          (cd shots && zip -q ../screenshots.zip ./*.png ./*.log)
          # made once, then its file replaced (see linux.yml)
          notes="Pictures of the interface for ${GITHUB_SHA}. Not a release."
          if ! gh release view ui-screenshots -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create ui-screenshots screenshots.zip -R "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "Interface screenshots (made by CI)" --notes "$notes" ||
              gh release upload ui-screenshots screenshots.zip -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release upload ui-screenshots screenshots.zip -R "$GITHUB_REPOSITORY" --clobber
            gh release edit ui-screenshots -R "$GITHUB_REPOSITORY" --notes "$notes"
          fi

